<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>도서 상세 | BookExchange</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/book-detail.css">
</head>

<body>

<header>
    <div class="header-inner">

        <h1 class="logo">
            <a href="/">📚 BookExchange</a>
        </h1>

        <nav class="main-nav">
            <a href="/">홈</a>
            <a href="/books">도서 목록</a>

            <!-- 로그인한 사용자에게만 표시 -->
            <a href="/books/new"
               th:if="${session.loginMember != null}">
                도서 등록
            </a>

            <a href="/exchanges"
               th:if="${session.loginMember != null}">
                교환 요청
            </a>
        </nav>


        <!-- 로그인하지 않은 상태 -->
        <div class="header-auth"
             th:if="${session.loginMember == null}">

            <a href="/login">로그인</a>
            <a href="/signup">회원가입</a>

        </div>


        <!-- 로그인한 상태 -->
        <div class="header-auth"
             th:if="${session.loginMember != null}">

            <span>
                <strong th:text="${session.loginMember.name}">
                    사용자
                </strong>님
            </span>

            <a href="/mypage">마이페이지</a>

            <a href="/logout">로그아웃</a>

        </div>

    </div>
</header>

<main class="container">

    <div class="detail-navigation">
        <a href="/books">← 도서 목록으로</a>
    </div>


    <section class="book-detail-layout">

        <!-- =========================
             도서 표지
        ========================== -->
        <div class="detail-cover">

            <img th:if="${book.imageName != null}"
                 th:src="@{/uploads/books/{imageName}(imageName=${book.imageName})}"
                 th:alt="${book.title}">

            <div class="detail-cover-empty"
                 th:if="${book.imageName == null}">

                <div class="detail-book-icon">
                    📖
                </div>

                <span>
                    등록된 표지가 없습니다.
                </span>

            </div>

        </div>


        <!-- =========================
             도서 정보
        ========================== -->
        <div class="detail-content">

            <!-- 상태 -->
            <span class="status available"
                  th:if="${book.status == 'AVAILABLE'}">
                교환 가능
            </span>

            <span class="status requested"
                  th:if="${book.status == 'REQUESTED'}">
                교환 요청 중
            </span>

            <span class="status available"
                  th:if="${book.status == 'REJECTED'}">
                교환 가능
            </span>

            <span class="status"
                  th:if="${book.status == 'EXCHANGED'}">
                교환 완료
            </span>


            <!-- 제목 -->
            <h2 th:text="${book.title}">
                도서 제목
            </h2>


            <!-- 저자 -->
            <div class="detail-author">

                <span>저자</span>

                <strong th:text="${book.author}">
                    저자 이름
                </strong>

            </div>


            <hr>


            <!-- 도서 설명 -->
            <div class="detail-description">

                <h3>도서 설명</h3>

                <p th:text="${book.description}">
                    도서 설명
                </p>

                <div class="detail-view-count">
                    <span>조회수</span>
                    <strong th:text="${viewCount} + '회'">0회</strong>
                </div>

            </div>


            <!-- =====================================================
                 교환 요청
            ====================================================== -->
            <div class="exchange-box">

                <div>

                    <strong>
                        이 책이 마음에 드시나요?
                    </strong>

                    <p>
                        교환을 원하는 경우 요청을 보낼 수 있습니다.
                    </p>

                </div>


                <!-- 로그인 -->
                <button th:if="${session.loginMember != null}"
                        id="exchangeButton"
                        class="button"
                        th:data-book-id="${book.id}"
                        th:disabled="${book.status != 'AVAILABLE'}">

                    교환 요청하기

                </button>


                <!-- 비로그인 -->
                <a th:if="${session.loginMember == null}"
                   href="/login"
                   class="button">

                    로그인 후 교환 요청

                </a>

            </div>

        </div>

    </section>

</main>


<footer>

    <div class="footer-inner">

        <strong>
            📚 BookExchange
        </strong>

        <span>
            중고 도서 교환 프로젝트 · Team 05
        </span>

    </div>

</footer>


<script src="/js/book-detail.js"></script>

</body>
</html>
