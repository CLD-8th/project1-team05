<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookExchange</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/home.css">
</head>

<body>

<header>
    <div class="header-inner">

        <h1 class="logo">
            <a href="/">📚 BookExchange</a>
        </h1>

        <nav>
            <a href="/">홈</a>
            <a href="/books">도서 목록</a>
            <a href="/books/new">도서 등록</a>
        </nav>

    </div>
</header>


<main class="container">

    <!-- 메인 소개 -->
    <section class="hero">

        <div class="hero-badge">
            📖 중고 도서 교환 서비스
        </div>

        <h2>
            책장 속 잠든 책을<br>
            새로운 책과 바꿔보세요.
        </h2>

        <p>
            더 이상 읽지 않는 책을 등록하고,<br>
            다른 사람이 등록한 책을 둘러보세요.
        </p>

        <div class="hero-buttons">

            <a class="button" href="/books">
                📚 도서 둘러보기
            </a>

            <a class="button button-secondary" href="/books/new">
                ＋ 도서 등록하기
            </a>

        </div>

    </section>


    <!-- 실제 도서 통계 -->
    <section class="stats">

        <div class="stat-card">
            <strong th:text="${totalCount}">0</strong>
            <span>등록된 도서</span>
        </div>

        <div class="stat-card">
            <strong th:text="${availableCount}">0</strong>
            <span>교환 가능</span>
        </div>

        <div class="stat-card">
            <strong th:text="${requestedCount}">0</strong>
            <span>교환 요청</span>
        </div>

    </section>


    <!-- 최근 등록 도서 -->
    <section class="recent-section">

        <div class="section-title">

            <div>
                <h2>최근 등록된 도서</h2>
                <p>새롭게 등록된 책을 확인해보세요.</p>
            </div>

            <a href="/books">
                전체보기 →
            </a>

        </div>


        <!-- 실제 도서가 있는 경우 -->
        <div class="book-grid"
             th:if="${!#lists.isEmpty(recentBooks)}">

            <article
                    class="book-preview"
                    th:each="book : ${recentBooks}">

                <!-- 도서 표지 -->
                <div class="book-cover">

                    <img
                            th:if="${book.imageName != null}"
                            th:src="@{/uploads/books/{imageName}(imageName=${book.imageName})}"
                            th:alt="${book.title}">

                    <div
                            class="book-cover-empty"
                            th:if="${book.imageName == null}">
                        📖
                    </div>

                </div>


                <!-- 도서 정보 -->
                <div class="book-info">

                    <span
                            class="status available"
                            th:if="${book.status == 'AVAILABLE'}">
                        교환 가능
                    </span>

                    <span
                            class="status requested"
                            th:if="${book.status == 'REQUESTED'}">
                        교환 요청 중
                    </span>

                    <span
                            class="status"
                            th:if="${book.status == 'EXCHANGED'}">
                        교환 완료
                    </span>


                    <h3 th:text="${book.title}"></h3>

                    <p
                            class="author"
                            th:text="${book.author}">
                    </p>

                    <p
                            class="description"
                            th:text="${book.description}">
                    </p>

                    <a
                            class="detail-link"
                            th:href="@{/books/{id}(id=${book.id})}">
                        상세보기 →
                    </a>

                </div>

            </article>

        </div>


        <!-- 등록된 도서가 없는 경우 -->
        <div
                class="empty-result"
                th:if="${#lists.isEmpty(recentBooks)}"
                style="display:block;">

            아직 등록된 도서가 없습니다.

        </div>

    </section>

</main>


<footer>

    <div class="footer-inner">

        <strong>
            📚 BookExchange
        </strong>

        <span>
            중고 도서 교환 프로젝트 · Team 05
        </span>

    </div>

</footer>

</body>
</html>
